<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScrollToon</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <span class="mint-dot" id="headerDot"></span>
        <h1>ScrollToon</h1>
      </div>
      <span class="hotkey-badge" title="Shortcut to toggle on current tab">⌥ S</span>
    </div>

    <!-- Prominent Manual Turn On / Off Button -->
    <div class="action-card">
      <button id="toggleBtn" class="primary-toggle-btn">
        <span class="toggle-icon" id="toggleIcon">⚡</span>
        <div class="toggle-meta">
          <span class="toggle-title" id="toggleTitle">Turn On on This Tab</span>
          <span class="toggle-hint" id="toggleHint">Shortcut: Option + S</span>
        </div>
      </button>
    </div>

    <!-- Speed Adjustment -->
    <div class="section">
      <label class="label">Default Cruise Speed</label>
      <div class="speed-picker">
        <input type="range" id="defaultSpeedInput" min="0.5" max="4.0" step="0.1" value="1.5">
        <span class="speed-val" id="speedVal">1.5x</span>
      </div>
    </div>

    <!-- Controls & Gestures -->
    <div class="section">
      <label class="label">Controls & Gestures</label>
      
      <div class="toggle-row">
        <span>Hold Left-Click Brake</span>
        <label class="switch">
          <input type="checkbox" id="leftClickBrake" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-row">
        <span>Middle-Click Toggle</span>
        <label class="switch">
          <input type="checkbox" id="middleClickToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-row">
        <span>Gutter Double-Click Toggle</span>
        <label class="switch">
          <input type="checkbox" id="doubleTapToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Tool Placement -->
    <div class="section">
      <label class="label">Tool Placement</label>
      <div class="position-row">
        <span>Default Location</span>
        <button id="resetPositionBtn" class="action-btn" title="Snap tool back to bottom-center default position">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>Reset Position</span>
        </button>
      </div>
    </div>

    <!-- Quick Hotkeys -->
    <div class="section shortcuts-section">
      <label class="label">Quick Hotkeys</label>
      <div class="shortcut-list">
        <div class="shortcut-item"><span>Turn On / Off Tool</span><kbd>Option + S</kbd></div>
        <div class="shortcut-item"><span>Hard Brake (Hold)</span><kbd>Hold Left-Click</kbd></div>
        <div class="shortcut-item"><span>Play / Pause</span><kbd>Space</kbd> or <kbd>Middle-Click</kbd></div>
        <div class="shortcut-item"><span>Speed ±0.1x</span><kbd>[</kbd> <kbd>]</kbd></div>
        <div class="shortcut-item"><span>Emergency Freeze</span><kbd>Esc</kbd></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
