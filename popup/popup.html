<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScrollToon</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header with Integrated Master Switch -->
    <div class="header">
      <div class="logo">
        <span class="mint-dot" id="headerDot"></span>
        <h1>ScrollToon</h1>
      </div>
      <div class="header-power">
        <span class="power-label" id="powerLabel">OFF</span>
        <label class="switch power-switch" title="Toggle autoscroller on current tab (⌥S)">
          <input type="checkbox" id="powerToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Minimal Hotkey Hint Banner -->
    <div class="shortcut-banner">
      <span>Toggle on current tab</span>
      <kbd>⌥ S</kbd>
    </div>

    <!-- Speed Adjustment -->
    <div class="section">
      <label class="label">Default Speed</label>
      <div class="speed-picker">
        <input type="range" id="defaultSpeedInput" min="0.5" max="4.0" step="0.1" value="1.5">
        <span class="speed-val" id="speedVal">1.5x</span>
      </div>
    </div>

    <!-- Controls & Gestures -->
    <div class="section">
      <label class="label">Controls</label>
      
      <div class="toggle-row">
        <span>Hold Left-Click Brake</span>
        <label class="switch">
          <input type="checkbox" id="leftClickBrake" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-row">
        <span>Middle-Click Toggle</span>
        <label class="switch">
          <input type="checkbox" id="middleClickToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-row">
        <span>Gutter Double-Click</span>
        <label class="switch">
          <input type="checkbox" id="doubleTapToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Tool Placement -->
    <div class="section">
      <label class="label">HUD Position</label>
      <div class="position-row">
        <span>Tool Location</span>
        <button id="resetPositionBtn" class="action-btn" title="Snap tool back to bottom center">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>Reset Position</span>
        </button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
